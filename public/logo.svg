<!-- Light Background Version (Standard Corporate Mark) -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600&amp;family=Montserrat:wght@300;400&amp;display=swap');
      .brand-title {
        font-family: 'Cinzel', 'Trajan Pro', 'Playfair Display', serif;
        font-size: 82px;
        font-weight: 500;
        letter-spacing: 0.28em;
        text-anchor: middle;
        dominant-baseline: middle;
      }
      .brand-subtitle {
        font-family: 'Montserrat', 'Lato', sans-serif;
        font-size: 15.5px;
        font-weight: 400;
        letter-spacing: 0.615em;
        text-anchor: middle;
        dominant-baseline: middle;
      }
      .divider {
        stroke-width: 1.25;
        stroke-linecap: square;
      }
    </style>
  </defs>

  <!-- Background removed for transparency -->
  <!-- <rect width="1200" height="600" fill="#FFFFFF" /> -->

  <!-- Main Wordmark -->
  <text x="618" y="260" fill="#0B1F3A" class="brand-title">ARVISTA</text>

  <!-- Hairline Geometric Divider Rule -->
  <line x1="334" y1="316" x2="690" y2="316" stroke="#B8985A" class="divider" />

  <!-- Subtitle (Matched Optical Width) -->
  <text x="618" y="348" fill="#B8985A" class="brand-subtitle">INTERNATIONAL</text>
</svg>
